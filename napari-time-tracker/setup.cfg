[metadata]
name = napari-time-tracker
version = 0.0.1
description = A napari plugin for time tracking with SAM integration
classifiers =
    Framework :: napari

[options]
packages = find:
include_package_data = True
install_requires =
    napari
    torch>=1.13.0
    torchvision>=0.14.0
    segment-anything
    numpy<2.0
    qtpy
    plotly.express
    dash
    pandas


[options.entry_points]
napari.manifest =
    napari-time-tracker = time_tracker:napari.yaml
    napari-sam = napari_sam:napari.yaml